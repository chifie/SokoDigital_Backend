version: '3.8'

x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sokodigital_db
  SECRET_KEY: change-me-in-production
  REDIS_URL: redis://redis:6379/0
  APP_URL: http://localhost:5173
  APP_NAME: SokoDigital API
  DEBUG: "true"
  ENVIRONMENT: development

services:
  db:
    image: postgres:16-alpine
    container_name: sokodigital-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sokodigital_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sokodigital-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sokodigital-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sokodigital-worker
    restart: unless-stopped
    environment:
      <<: *common-env
      RUN_MIGRATIONS: "false"
    entrypoint:
      - python
      - -m
      - arq
      - app.tasks.WorkerSettings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
