---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sokodigital-config
  labels:
    app: sokodigital
data:
  # ── App ──────────────────────────────────────────────────────────────────────
  APP_NAME: "SokoDigital API"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  APP_URL: "https://sokodigital.com"

  # ── API ──────────────────────────────────────────────────────────────────────
  API_V1_PREFIX: "/api/v1"

  # ── Upload ──────────────────────────────────────────────────────────────────
  UPLOAD_DIR: "/app/uploads"
  MAX_UPLOAD_SIZE: "5242880"

  # ── AI (OpenAI-compatible) ──────────────────────────────────────────────────
  AI_API_URL: "https://api.openai.com/v1/chat/completions"
  AI_MODEL: "gpt-4o-mini"
  AI_MAX_TOKENS: "1024"

  # ── Environment ─────────────────────────────────────────────────────────────
  ENVIRONMENT: "production"
