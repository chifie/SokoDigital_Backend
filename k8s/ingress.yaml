---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sokodigital-api
  labels:
    app: sokodigital
    component: api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.sokodigital.com
      secretName: sokodigital-api-tls
  rules:
    - host: api.sokodigital.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sokodigital-api
                port:
                  number: 80
